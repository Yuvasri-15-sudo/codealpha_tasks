<!DOCTYPE html>
<html>
<head>
    <title>🌍 Language Translator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<button id="darkModeBtn" onclick="toggleDarkMode()">🌙 Dark Mode</button>

<h1>🌍 Language Translation Tool</h1>

<form method="POST">

    <textarea name="text" rows="5" cols="50" placeholder="Enter text here"></textarea>

    <br><br>

    <label>From:</label>

    <select name="source" id="source">
        <option value="auto">🌐 Auto Detect</option>
        <option value="en">English</option>
        <option value="ta">Tamil</option>
        <option value="hi">Hindi</option>
        <option value="te">Telugu</option>
        <option value="ml">Malayalam</option>
        <option value="kn">Kannada</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="es">Spanish</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh-CN">Chinese</option>
        <option value="ar">Arabic</option>
    </select>

    <button type="button" onclick="swapLanguages()">🔄 Swap</button>

    <label>To:</label>

    <select name="target" id="target">
        <option value="en">English</option>
        <option value="ta">Tamil</option>
        <option value="hi">Hindi</option>
        <option value="te">Telugu</option>
        <option value="ml">Malayalam</option>
        <option value="kn">Kannada</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="es">Spanish</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh-CN">Chinese</option>
        <option value="ar">Arabic</option>
    </select>

    <br><br>

    <button type="submit">🌐 Translate</button>

</form>

<br>

<div>
    <textarea id="translatedText" rows="5" cols="50" readonly placeholder="Translated text">{{ translated_text }}</textarea>

    <br><br>

    <button type="button" onclick="copyText()">📋 Copy</button>

    <button type="button" onclick="speakText()">🔊 Speak</button>

    <h3>🕒 Recent Translations</h3>

<div class="history">
    {% for item in history %}
        <div class="history-item">
            <b>Original:</b> {{ item.original }}<br>
            <b>Translated:</b> {{ item.translated }}
        </div>
    {% endfor %}
</div>

</div>

<script>
function copyText() {
    var copyText = document.getElementById("translatedText");
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);
    alert("✅ Copied!");
}

function swapLanguages() {
    let source = document.getElementById("source");
    let target = document.getElementById("target");

    let temp = source.value;
    source.value = target.value;
    target.value = temp;
}

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");

    let btn = document.getElementById("darkModeBtn");

    if(document.body.classList.contains("dark-mode")){
        btn.innerHTML = "☀️ Light Mode";
    } else {
        btn.innerHTML = "🌙 Dark Mode";
    }
}

function speakText() {

    let text = document.getElementById("translatedText").value;

    if(text.trim() === ""){
        alert("No translated text available!");
        return;
    }

    let speech = new SpeechSynthesisUtterance(text);

    // Detect language based on selected target language
    let lang = document.getElementById("target").value;

    if(lang === "en") speech.lang = "en-US";
    else if(lang === "ta") speech.lang = "ta-IN";
    else if(lang === "hi") speech.lang = "hi-IN";
    else if(lang === "te") speech.lang = "te-IN";
    else if(lang === "ml") speech.lang = "ml-IN";
    else if(lang === "kn") speech.lang = "kn-IN";
    else speech.lang = "en-US";

    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}

</script>

</div>

</body>
</html>
